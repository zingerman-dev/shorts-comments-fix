<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Store graphics</title>
<style>
  :root {
    --red: #FF0033;
    --red-ink: #C8002B;
    --ink: #2D0B14;
    --ink-soft: #6E4A52;
    --muted: #9A7F85;
    --paper: #FFF4F5;
    --blush: #FBE4E8;
    --line: #E9CFD5;
    --rose: #F6C9D2;
    --display: 'Unbounded Variable', 'Arial Black', sans-serif;
    --text: 'Onest Variable', 'Helvetica Neue', Arial, sans-serif;
  }
  /* Unbounded and Onest cover Latin and Cyrillic; other scripts get a headline and a text face of their own.
     Hindi and Bengali headlines take Baloo's Latin too: next to them Unbounded's "Short" read as an accent. */
  :lang(ja) { --display: 'Unbounded Variable', 'M PLUS 1 Variable', sans-serif; --text: 'Onest Variable', 'Noto Sans JP Variable', sans-serif; }
  :lang(zh) { --display: 'Unbounded Variable', 'Noto Sans SC Variable', sans-serif; --text: 'Onest Variable', 'Noto Sans SC Variable', sans-serif; }
  :lang(hi) { --display: 'Baloo 2 Variable', sans-serif; --text: 'Onest Variable', 'Noto Sans Devanagari Variable', sans-serif; }
  :lang(bn) { --display: 'Baloo Da 2 Variable', sans-serif; --text: 'Onest Variable', 'Noto Sans Bengali Variable', sans-serif; }
  :lang(ar) { --display: 'Unbounded Variable', 'Baloo Bhaijaan 2 Variable', sans-serif; --text: 'Onest Variable', 'Noto Sans Arabic Variable', sans-serif; }
  :lang(he) { --display: 'Unbounded Variable', 'Rubik Variable', sans-serif; --text: 'Onest Variable', 'Heebo Variable', sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--text);
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  p, h1, h2, ul { margin: 0; }
  .asset { position: relative; overflow: hidden; }

  .display {
    font-family: var(--display);
    font-weight: 600;
    letter-spacing: -0.015em;
  }
  .display:is(:lang(ja), :lang(zh), :lang(hi), :lang(bn), :lang(ar), :lang(he)) { letter-spacing: 0; }
  /* Japanese has no spaces: break lines between phrases, not inside words. */
  :lang(ja) { word-break: auto-phrase; }
  .lockup {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 600;
    white-space: nowrap;
  }
  .lockup img { width: 40px; height: 40px; }

  /* A short: illustration with the caption overlay of a vertical video. */
  .short {
    position: relative;
    width: 270px;
    height: 480px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 22px 44px -20px rgba(45, 11, 20, 0.5);
  }
  .short > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .short .shade {
    position: absolute;
    inset: auto 0 0 0;
    height: 46%;
    background: linear-gradient(rgba(24, 6, 11, 0), rgba(24, 6, 11, 0.74));
  }
  .short .caption { position: absolute; inset-inline: 16px 58px; bottom: 18px; color: #fff; }
  .short .channel { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .short .channel i { width: 24px; height: 24px; border-radius: 50%; background: #FFD28A; }
  .short .title { font-size: 15px; font-weight: 500; line-height: 1.3; }
  .short .actions { position: absolute; inset-inline-end: 12px; bottom: 20px; display: grid; gap: 12px; }
  .short .actions i {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.24);
    display: grid;
    place-items: center;
  }
  .short .actions svg { width: 18px; height: 18px; }
  .short.mini { width: 132px; height: 235px; border-radius: 16px; box-shadow: none; }
  .short.mini .caption, .short.mini .actions { display: none; }

  /* Comments panel */
  .panel {
    height: 480px;
    border-radius: 20px;
    background: #fff;
    color: var(--ink);
    padding: 20px 20px 18px;
    display: flex;
    flex-direction: column;
  }
  .panel-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 20px; font-size: 18px; font-weight: 700; }
  .panel-head span { font-size: 15px; font-weight: 400; color: var(--muted); }
  .comments { list-style: none; padding: 0; display: grid; gap: 18px; align-content: start; flex: 1; }
  .comment { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
  }
  .meta { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .meta span { margin-inline-start: 6px; font-weight: 400; color: var(--muted); }
  .text { font-size: 16px; line-height: 1.35; }
  .note { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; line-height: 1.3; }
  .note .short.mini { flex: none; width: 26px; height: 46px; border-radius: 6px; }
  .note img { flex: none; width: 30px; height: 30px; }

  .panel.wrong { background: rgba(255, 255, 255, 0.55); border: 2px dashed var(--line); }
  .panel.wrong .comments { opacity: 0.4; }
  .panel.wrong .note { color: var(--ink-soft); }
  .panel.right { border: 2px solid var(--red); }
  .panel.right .note { color: var(--red-ink); }

  /* Screenshot 1: one short, the comments it gets without and with the extension. */
  .s1 { width: 1280px; height: 800px; padding: 56px 64px 0; }
  .s1 header { display: flex; justify-content: space-between; align-items: flex-start; gap: 40px; }
  .s1 h1 { font-size: 46px; line-height: 1.12; max-width: 800px; }
  :lang(ru) .s1 h1, :lang(ru) .s2 h1 { font-size: 40px; max-width: 870px; }
  .s1 .lockup { margin-top: 6px; }
  .s1 .stage {
    position: absolute;
    left: 0;
    right: 0;
    top: 236px;
    display: grid;
    grid-template-columns: 330px 60px 270px 60px 330px;
    justify-content: center;
  }
  .s1 .state { height: 20px; margin-bottom: 12px; font-size: 16px; font-weight: 600; }
  .s1 .state.wrong { color: var(--muted); }
  .s1 .state.right { color: var(--red-ink); }
  .link { position: relative; }
  .link::before, .link::after { content: ''; position: absolute; top: 271px; }
  .link.right::before { left: 0; right: 0; border-top: 3px solid var(--red); }
  .link.wrong::before { left: 0; width: 34%; border-top: 3px dashed var(--muted); }
  .link.wrong::after { right: 0; width: 34%; border-top: 3px dashed var(--muted); }

  /* Screenshot 2: the sequence in three scenes. */
  .s2 { width: 1280px; height: 800px; padding: 56px 64px 0; }
  .s2 header { display: flex; justify-content: space-between; align-items: flex-start; gap: 40px; }
  .s2 h1 { font-size: 46px; line-height: 1.12; }
  .s2 .sub { margin-top: 14px; font-size: 20px; line-height: 1.4; color: var(--ink-soft); }
  .steps {
    position: absolute;
    left: 64px;
    right: 64px;
    top: 222px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 48px;
  }
  .scene { position: relative; height: 350px; border-radius: 24px; background: var(--blush); overflow: hidden; }
  .scene .short.mini { position: absolute; inset-inline-start: 62px; width: 112px; height: 199px; }
  .scene .prev { top: -44px; opacity: 0.5; }
  .scene .current { top: 167px; }
  .step .num { margin: 22px 0 8px; font-family: 'Unbounded Variable', var(--display); font-size: 20px; color: var(--red-ink); }
  .step p { font-size: 20px; line-height: 1.4; max-width: 340px; }
  .bubble {
    position: absolute;
    inset-inline-start: 192px;
    width: 128px;
    padding: 11px 13px;
    border-radius: 14px;
    background: #fff;
    font-size: 14px;
    line-height: 1.3;
  }
  .bubble::before {
    content: '';
    position: absolute;
    inset-inline-start: -6px;
    top: 16px;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    background: #fff;
    transform: rotate(45deg);
  }
  .bubble.loading { top: 46px; width: 74px; display: flex; gap: 7px; }
  .bubble.loading i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .bubble.late { top: 208px; color: var(--ink-soft); }
  .bubble.own { top: 208px; box-shadow: 0 0 0 2px var(--red); }
  .bubble .mark { position: absolute; inset-inline-end: -17px; top: -19px; width: 36px; height: 36px; }
  .mark.x { width: 28px; height: 28px; inset-inline-end: -11px; top: -13px; border-radius: 50%; background: var(--ink-soft); display: grid; place-items: center; }
  .trail { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  [dir='rtl'] .trail { transform: scaleX(-1); }
  .facts {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 46px;
    display: flex;
    gap: 44px;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .facts span { display: flex; align-items: center; gap: 10px; }
  .facts svg { width: 20px; height: 20px; flex: none; }

  /* Promo tiles */
  .promo-small {
    width: 440px;
    height: 280px;
    padding: 0 30px;
    background: var(--ink);
    color: #fff;
    display: grid;
    grid-template-columns: 112px 1fr;
    gap: 22px;
    align-items: center;
  }
  .promo-small > img { width: 112px; height: 112px; }
  .promo-small h2 { font-size: 24px; line-height: 1.18; margin-bottom: 12px; }
  .promo-small .tagline { font-size: 16px; line-height: 1.35; color: var(--rose); }

  .promo-marquee { width: 1400px; height: 560px; padding: 70px 80px; background: var(--ink); color: #fff; }
  .promo-marquee > h2 { margin: 40px 0 20px; font-size: 44px; line-height: 1.14; max-width: 560px; }
  :lang(ru) .promo-marquee > h2 { font-size: 40px; max-width: 570px; }
  .promo-marquee > .tagline { font-size: 21px; line-height: 1.45; color: var(--rose); max-width: 520px; }
  .promo-marquee .stage {
    position: absolute;
    right: 80px;
    top: 40px;
    display: grid;
    grid-template-columns: 270px 56px 330px;
  }
  .promo-marquee .link::before { top: 239px; }
</style>

          <div class="lockup"><img src="icon.svg" alt="">${t.brand}</div>
        </header>
        <div class="stage">
          <div><p class="state wrong">${t.without}</p>${panel(t, 'wrong')}</div>
          <div class="link wrong"></div>
          <div><p class="state"></p>${short(t, birdhouse)}</div>
          <div class="link right"></div>
          <div><p class="state right">${t.with}</p>${panel(t, 'right')}</div>
        </div>
      </section>`,

    'screenshot-2': (t) => {
      const prev = short(t, cat, 'mini prev');
      const current = short(t, birdhouse, 'mini current');
      const scenes = [
        `${prev}${current}<div class="bubble loading"><i></i><i></i><i></i></div>
         <svg class="trail" viewBox="0 0 352 350"><path d="M300 290 V150" stroke="#6E4A52" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M288 164 L300 148 L312 164" stroke="#6E4A52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`,
        `${prev}${current}
         <svg class="trail" viewBox="0 0 352 350"><path d="M246 70 C 304 110, 304 160, 262 200" stroke="#9A7F85" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" fill="none"/></svg>
         <div class="bubble late">${t.late}<span class="mark x">${ICON_X}</span></div>`,
        `${prev}${current}<div class="bubble own">${t.own}<img class="mark" src="icon.svg" alt=""></div>`,
      ];
      return `
        <section class="asset s2">
          <header>
            <div><h1 class="display">${t.s2Title}</h1><p class="sub">${t.s2Sub}</p></div>
            <div class="lockup"><img src="icon.svg" alt="">${t.brand}</div>
          </header>
          <div class="steps">
            ${scenes.map((scene, i) => `
              <div class="step">
                <div class="scene">${scene}</div>
                <p class="num display">${t.stepNumbers?.[i] ?? i + 1}</p>
                <p>${t.steps[i]}</p>
              </div>`).join('')}
          </div>
          <div class="facts">${t.facts.map((fact, i) => `<span>${FACT_ICONS[i]}${fact}</span>`).join('')}</div>
        </section>`;
    },

    'promo-small': (t) => `
      <section class="asset promo-small">
        <img src="icon.svg" alt="">
        <div><h2 class="display">${t.brand}</h2><p class="tagline">${t.tagline}</p></div>
      </section>`,

    'promo-marquee': (t) => `
      <section class="asset promo-marquee">
        <div class="lockup"><img src="icon.svg" alt="">${t.brand}</div>
        <h2 class="display">${t.marquee}</h2>
        <p class="tagline">${t.marqueeSub}</p>
        <div class="stage">
          ${short(t, birdhouse)}
          <div class="link right"></div>
          ${panel(t, 'right')}
        </div>
      </section>`,
  };

  const params = new URLSearchParams(location.search);
  const lang = COPY[params.get('lang')] ? params.get('lang') : 'en';
  const asset = render[params.get('asset')] ? params.get('asset') : 'screenshot-1';
  document.documentElement.lang = lang.replace('_', '-');
  document.documentElement.dir = ['ar', 'he'].includes(lang) ? 'rtl' : 'ltr';
  document.getElementById('root').innerHTML = render[asset](COPY[lang]);
</script>
</body>
</html>
